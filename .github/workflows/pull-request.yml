name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CONTRACTS_PATH: _contracts

jobs:
  validate:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v6

      - name: Checkout contracts
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.CONTRACTS_REPOSITORY }}
          token: ${{ secrets.CONTRACTS_REPO_TOKEN }}
          path: ${{ env.CONTRACTS_PATH }}
          ref: main

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Generate web stubs
        working-directory: ${{ env.CONTRACTS_PATH }}
        env:
          BUILDKIT_PROGRESS: quiet
          DOCKER_BUILDKIT: '1'
        run: |
          test -f Taskfile.yml
          task gen-web
          task gen-web-types

      - name: Copy generated web stubs into package
        shell: bash
        run: |
          set -euo pipefail
          src="${CONTRACTS_PATH}/web"
          dest="src/vascular"
          test -d "$src"
          mkdir -p "$dest"
          rsync -a --delete \
            --include='*.ts' --include='*.js' --include='*.d.ts' \
            --include='google/***' --include='types/***' \
            --exclude='node_modules/***' \
            "${src}/" "${dest}/"
          echo "--- src/vascular ---"
          ls src/vascular
          echo "--- src/vascular/types ---"
          ls src/vascular/types
          echo "--- src/vascular/google ---"
          ls -R src/vascular/google

      - name: Remove contracts from runner
        run: rm -rf "${CONTRACTS_PATH}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dry-run (npm)
        run: npm publish --dry-run --access public --ignore-scripts
